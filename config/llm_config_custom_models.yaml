# Custom model configuration showing flexibility

embeddings:
  provider: openai
  model: text-embedding-3-large  # Using large embedding model
  api_key: ${OPENAI_API_KEY}

query_clarification:
  provider: openai
  model: gpt-4o  # Using more capable model for query understanding
  api_key: ${OPENAI_API_KEY}

answer_generation:
  provider: perplexity
  model: mistral-8x7b-instruct  # Using Mistral model from Perplexity
  api_key: ${PERPLEXITY_API_KEY}

reranking:
  provider: perplexity
  model: llama-3-70b-instruct  # Using Llama 3 for reranking
  api_key: ${PERPLEXITY_API_KEY}