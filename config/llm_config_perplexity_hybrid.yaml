# Hybrid LLM configuration using OpenAI for embeddings and Perplexity for reasoning

embeddings:
  provider: openai
  model: text-embedding-3-small
  api_key: ${OPENAI_API_KEY}  # Will be filled from environment variable

query_clarification:
  provider: perplexity
  model: pplx-7b-online
  api_key: ${PERPLEXITY_API_KEY}

answer_generation:
  provider: perplexity
  model: pplx-7b-online
  api_key: ${PERPLEXITY_API_KEY}

reranking:
  provider: perplexity
  model: pplx-7b-online
  api_key: ${PERPLEXITY_API_KEY}